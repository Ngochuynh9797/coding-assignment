x-app: &app
  build: .
  image: workout-logging-api:local
  environment:
    NODE_ENV: production
    PORT: 3000
    DATABASE_URL: postgres://workout:workout@db:5432/workout
    DB_POOL_MAX: 10
    LOG_LEVEL: info

x-one-shot: &one-shot
  <<: *app
  restart: 'no'
  # The image's HEALTHCHECK probes the HTTP server, which one-shot jobs never start.
  healthcheck:
    disable: true

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: workout
      POSTGRES_PASSWORD: workout
      POSTGRES_DB: workout
    ports:
      - '${DB_HOST_PORT:-5432}:5432'
    volumes:
      # postgres:18 keeps PGDATA in a versioned subdirectory (/var/lib/postgresql/18/docker).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workout -d workout']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *one-shot
    command: ['node', 'dist/infrastructure/database/migrate.js', 'run']
    depends_on:
      db:
        condition: service_healthy

  # Local only: the catalog is test data; a real deployment has an admin own it.
  seed-catalog:
    <<: *one-shot
    command: ['node', 'dist/seeds/catalog/seed-catalog.js']
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    <<: *app
    ports:
      - '3000:3000'
    depends_on:
      seed-catalog:
        condition: service_completed_successfully

volumes:
  pgdata:
