services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: workout
      POSTGRES_PASSWORD: workout
      POSTGRES_DB: workout
    ports:
      - '${DB_HOST_PORT:-5432}:5432'
    volumes:
      # postgres:18 keeps PGDATA in a versioned subdirectory (/var/lib/postgresql/18/docker).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workout -d workout']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://workout:workout@db:5432/workout
      DB_POOL_MAX: 10
      LOG_LEVEL: info
      IDEMPOTENCY_TTL_HOURS: 24
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
